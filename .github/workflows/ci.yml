name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOPRIVATE: github.com/handarbeit
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  # slow-gate is a required status check whose duration is controlled by an
  # opt-in marker in the PR body. Without the marker it exits in seconds.
  # With the marker present it sleeps for SLOW_CI_SECONDS to deliberately
  # widen the window during which main can move under an in-flight PR — used
  # by the convergence-race e2e test for handarbeit/fabrik#829.
  slow-gate:
    runs-on: ubuntu-latest
    env:
      SLOW_CI_SECONDS: "600"
      # slow-ci-required-long: a wider window for scenarios whose CI-await
      # window starts only after Review's latency (TestConjunctiveCIReviewGate).
      # Checked first — the plain marker is a prefix of it.
      SLOW_CI_LONG_SECONDS: "1500"
    steps:
      - name: Conditional slow gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -q 'slow-ci-required-long'; then
            echo "long marker present — sleeping ${SLOW_CI_LONG_SECONDS}s"
            sleep "${SLOW_CI_LONG_SECONDS}"
          elif echo "$PR_BODY" | grep -q 'slow-ci-required'; then
            echo "marker present — sleeping ${SLOW_CI_SECONDS}s to widen the merge-race window"
            sleep "${SLOW_CI_SECONDS}"
          else
            echo "no slow-ci-required marker — fast path"
          fi

  # ci-fix-sentinel is a required status check used by the CI-fix reinvoke e2e test
  # (handarbeit/fabrik#897). Without a sentinel marker in the PR body it exits 0
  # immediately. With ci-fix-sentinel-required it fails unless SENTINEL_FIX contains
  # the magic string. With ci-fix-sentinel-unfixable it always fails unconditionally.
  # With ci-fix-sentinel-ack it fails until CI_FIX_ACK holds ack:<first run ID> (#1991).
  ci-fix-sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI fix sentinel
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # ci-fix-sentinel-ack (handarbeit/fabrik#1991, ADR 1991): the nonce T is the ID of the
          # earliest ci.yml pull_request run on the PR's head branch, so run T is red by
          # construction and T is not derivable from the worktree. The engine delivers the
          # ::error annotation (which names ack:<T>) to the agent only via the CI-fix reinvoke.
          if printf '%s' "$PR_BODY" | grep -q 'ci-fix-sentinel-ack'; then
            WF=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
            T=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF/runs?branch=$BRANCH&event=pull_request&per_page=100" \
                  --jq '[.workflow_runs[].id] | min')
            if [ "$GITHUB_RUN_ID" != "$T" ] && grep -qx "ack:$T" CI_FIX_ACK 2>/dev/null; then
              echo "ci-fix-sentinel: acknowledgement ack:$T found"
              exit 0
            fi
            echo "::error title=ci-fix-sentinel::CI-fix required: create CI_FIX_ACK at the repo root containing the line ack:$T"
            exit 1
          fi
          if echo "$PR_BODY" | grep -qF 'ci-fix-sentinel-unfixable'; then
            echo "::error::Unfixable sentinel — fails unconditionally by design (e2e test)"
            exit 1
          fi
          if echo "$PR_BODY" | grep -qF 'ci-fix-sentinel-required'; then
            NONCE="$(git rev-list ${{ github.event.pull_request.base.sha }}..HEAD | tail -1)"
            echo "To satisfy CI, create SENTINEL_FIX containing: ${NONCE}" >> "$GITHUB_STEP_SUMMARY"
            if [ -f SENTINEL_FIX ] && grep -qF "${NONCE}" SENTINEL_FIX; then
              echo "Sentinel satisfied — SENTINEL_FIX contains nonce"
            else
              echo "::error::CI fix sentinel FAILED"
              echo "This PR includes the ci-fix-sentinel-required marker."
              echo "Fix: create a file named SENTINEL_FIX containing: ${NONCE}"
              echo "Then commit and push. Do not modify any other files."
              exit 1
            fi
          else
            echo "No sentinel marker — passing"
          fi
