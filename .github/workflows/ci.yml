name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOPRIVATE: github.com/handarbeit
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure git credentials
        run: git config --global url."https://${{ secrets.HANDARBEIT_PAT }}@github.com/".insteadOf "https://github.com/"
      - run: go build ./...
      - run: go test ./...
