name: Claude PR Review

# Test-repo bot reviewer. Replaces Gemini on the fabrik-test-* repos so e2e
# review-gate scenarios get a bot review without draining the shared handarbeit
# Gemini quota. Submits a FORMAL review (not an issue comment) so it lands in the
# PR's reviews array — the signal Fabrik's checkReviewGate waits on (engine/reviews.go).

on:
  # NOTE: 'synchronize' is deliberately excluded. Fabrik auto-fixes review
  # findings and pushes, which would re-trigger a review, which finds more,
  # which triggers another fix — an unbounded review/fix loop (observed on
  # handarbeit/fabrik#1078: 18 reviews before FABRIK_MAX_REVIEW_CYCLES tripped).
  # Review once when the PR is ready; a human merges.
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # required to submit a formal PR review
  id-token: write        # required by claude-code-action (OIDC)

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts — the gate only engages after Fabrik marks the PR ready.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # continue-on-error: this is a REVIEWER fixture, not a CI check. Its job
      # is to put a formal review in the PR's reviews array for the review-gate
      # scenarios; the "Ensure a formal review exists" safety net below already
      # guarantees that even when this step fails, which is why the step's
      # failure was never meant to be fatal.
      #
      # Without this, an agent/API outage turns the fixture into a permanently
      # red `review` check, and since #1441 removed the mergeable_state
      # shortcut, Fabrik correctly gates on ANY failed check — required or not
      # (`review` is not in this repo's required contexts). The result is that
      # every auto-merge/CI-gate scenario fails for a reason that has nothing
      # to do with Fabrik: observed 2026-08-13, where all 158 ci-gate failures
      # in a full two-mode gate run were this one check, blocking #4671, #4694,
      # #4698 and #299 (the agent step died at init in 295ms, $0 cost — an
      # expired/exhausted ANTHROPIC_API_KEY in this repo's secrets).
      #
      # The failure stays visible: the step is still marked failed in the run,
      # and the safety net below says explicitly that the agent did not
      # complete, so a degraded review is never mistaken for a clean one.
      - name: Claude review
        continue-on-error: true
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the diff for PR #${{ github.event.pull_request.number }}
            (`git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`).
            Flag correctness bugs, missing tests, and obvious risks. Be concise.
            Then submit a FORMAL pull-request review (not an issue comment) with:
              gh pr review ${{ github.event.pull_request.number }} --comment --body-file <your-findings-file>
            Add inline comments for specific line-level issues where useful.
          claude_args: "--model claude-sonnet-5 --allowedTools Bash(git:*),Bash(gh:*),Read,Grep"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Safety net: guarantee the review gate always clears even if the agent
      # posted only a comment. A no-op if a formal review already exists.
      #
      # The body distinguishes "the agent ran and found nothing" from "the
      # agent never completed" — the previous single message claimed the
      # former in both cases, so a fixture outage read as a clean review.
      - name: Ensure a formal review exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          AGENT_OUTCOME: ${{ steps.claude_review.outcome }}
        run: |
          set -m
          count=$(gh pr view "$PR" --json reviews \
            --jq '[.reviews[] | select(.author.login=="github-actions" or (.author.login|startswith("claude")))] | length')
          if [ "${count:-0}" -eq 0 ]; then
            if [ "$AGENT_OUTCOME" = "success" ]; then
              body="🤖 Automated test-repo review (Claude). No blocking issues surfaced by the agent step."
            else
              body="🤖 Automated test-repo review (Claude) — **DEGRADED**: the agent step did not complete (outcome: \`${AGENT_OUTCOME}\`), so this PR was NOT actually reviewed. Posting a formal review anyway so the review gate is exercised; check this repo's ANTHROPIC_API_KEY secret."
            fi
            gh pr review "$PR" --comment --body "$body"
          fi
